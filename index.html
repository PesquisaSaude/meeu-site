<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa de Satisfação - SESI Saúde</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }

    .question-card { text-align: center; }
    select { text-align: center; text-align-last: center; }

    .rating-container {
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: thin;
    }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(11, minmax(38px, 1fr));
      gap: 6px;
      min-width: 460px;
    }

    .rating-label {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 38px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
    }

    .rating input[type="radio"]:checked + .rating-label {
      transform: scale(1.15);
      box-shadow: 0 0 0 5px rgba(0, 102, 204, 0.4);
      border: 3px solid #0066cc;
      background-color: #1e40af !important;
      color: white;
    }

    @media (max-width: 640px) {
      .rating-grid { grid-template-columns: repeat(11, minmax(32px, 1fr)); gap: 5px; min-width: 390px; }
      .rating-label { height: 48px; font-size: 0.95rem; }
    }

    .chart-container {
      position: relative;
      height: 260px;
      width: 100%;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- Cabeçalho -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="img/sesisaude.png" alt="Logo SESI Saúde" class="h-12 w-auto">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Pesquisa Rapidinha</h1>
          <p class="text-blue-600">SESI Saúde</p>
        </div>
      </div>
      <button onclick="openAdmin()" class="flex items-center gap-2 bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-2xl font-medium transition-all">
        <i class="fas fa-chart-bar"></i>
        <span>Gerenciar Respostas (BI)</span>
      </button>
    </div>
  </header>

  <!-- TELA DA PESQUISA -->
  <div id="surveyScreen" class="max-w-3xl mx-auto px-4 sm:px-6 pt-8 pb-12">
    <form id="surveyForm" class="space-y-6">
      <div class="mb-6">
        <div class="flex justify-between text-sm text-gray-500 mb-2">
          <span>Progresso</span>
          <span id="progressText">0/5</span>
        </div>
        <div class="h-2.5 bg-gray-200 rounded-full overflow-hidden">
          <div id="progressBar" class="h-2.5 bg-blue-600 rounded-full w-0 transition-all"></div>
        </div>
      </div>

      <div class="question-card bg-white p-6 rounded-3xl shadow">
        <label class="block text-base font-semibold text-gray-800 mb-4">1. Que tipo de atendimento você fez hoje?</label>
        <select name="q1" id="q1" required class="w-full max-w-xs mx-auto text-base py-4 px-5 border border-gray-300 rounded-2xl">
          <option value="">Escolha uma opção...</option>
          <option value="Odontologia">Odontologia</option>
          <option value="Especialidades Médicas">Especialidades Médicas</option>
          <option value="Medicina do Trabalho">Medicina do Trabalho</option>
        </select>
      </div>

      <div id="questionsContainer" class="space-y-6"></div>

      <div class="question-card bg-white p-6 rounded-3xl shadow">
        <label class="block text-base font-semibold text-gray-800 mb-4">6. Quer deixar algum comentário? (opcional)</label>
        <textarea name="q6" id="q6" rows="3" class="w-full max-w-lg mx-auto px-5 py-4 border border-gray-300 rounded-2xl text-base resize-none" placeholder="Escreva aqui sua opinião..."></textarea>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold text-xl py-6 rounded-3xl shadow-lg hover:brightness-105 transition-all">
        ENVIAR MINHA OPINIÃO
      </button>
    </form>
  </div>

  <!-- TELA DO BI -->
  <div id="adminScreen" class="hidden min-h-screen bg-gray-100">
    <div class="max-w-6xl mx-auto p-6">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">📊 Dashboard de Satisfação - SESI Saúde</h1>
        <div class="flex gap-3">
          <button onclick="exportToExcel()" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-medium">
            <i class="fas fa-download"></i> Baixar Excel
          </button>
          <button onclick="closeAdmin()" class="text-red-600 hover:text-red-700 font-medium">← Voltar</button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-6 rounded-3xl shadow text-center">
          <p class="text-gray-500">Total Respostas</p>
          <p id="totalResponses" class="text-4xl font-bold text-blue-600">0</p>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow text-center">
          <p class="text-gray-500">Média Geral</p>
          <p id="avgScore" class="text-4xl font-bold text-emerald-600">0.0</p>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow text-center">
          <p class="text-gray-500">NPS Estimado</p>
          <p id="npsScore" class="text-4xl font-bold text-amber-600">0</p>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow text-center">
          <p class="text-gray-500">% Excelente</p>
          <p id="excellentPct" class="text-4xl font-bold text-purple-600">0%</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-3xl shadow">
          <h3 class="font-semibold mb-4">Média por Critério</h3>
          <div class="chart-container"><canvas id="chartCriteria"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow">
          <h3 class="font-semibold mb-4">Distribuição de Notas</h3>
          <div class="chart-container"><canvas id="chartDistribution"></canvas></div>
        </div>
      </div>

      <div class="mt-6 bg-white p-6 rounded-3xl shadow">
        <h3 class="font-semibold mb-4">📈 Evolução da Satisfação</h3>
        <div class="chart-container" style="height: 240px;"><canvas id="chartTrend"></canvas></div>
      </div>

      <div class="mt-6 bg-white p-6 rounded-3xl shadow">
        <h3 class="font-semibold mb-4">📊 NPS por Mês</h3>
        <div class="chart-container" style="height: 240px;"><canvas id="chartNPSMonth"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    let allResponses = [];
    let charts = {};

    function createRatingQuestion(num, label) {
      const container = document.getElementById('questionsContainer');
      const div = document.createElement('div');
      div.className = "question-card bg-white p-6 rounded-3xl shadow";
      div.innerHTML = `
        <label class="block text-base font-semibold text-gray-800 mb-4">${num}. ${label}</label>
        <div class="rating-container max-w-2xl mx-auto">
          <div class="rating-grid">
            ${Array.from({length:11}, (_,i) => `
              <div>
                <input type="radio" name="q${num}" value="${i}" id="q${num}_${i}" class="hidden peer">
                <label for="q${num}_${i}" class="rating-label peer-checked:scale-110 block text-white font-bold text-base cursor-pointer
                  bg-${i<=2?'red':i<=4?'orange':i<=6?'yellow':i<=8?'lime':'emerald'}-500 hover:brightness-110">
                  ${i}
                </label>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="flex justify-between text-xs text-gray-400 mt-3 px-2 max-w-2xl mx-auto">
          <span>Muito ruim</span>
          <span>Ótimo</span>
        </div>
      `;
      container.appendChild(div);
    }

    function destroyAllCharts() {
      Object.keys(charts).forEach(key => {
        if (charts[key]) charts[key].destroy();
      });
      charts = {};
    }

    function calculateAverages() {
      if (allResponses.length === 0) return [0, 0, 0, 0];
      let q2 = 0, q3 = 0, q4 = 0, q5 = 0;
      allResponses.forEach(r => {
        q2 += r.q2 || 0;
        q3 += r.q3 || 0;
        q4 += r.q4 || 0;
        q5 += r.q5 || 0;
      });
      const n = allResponses.length;
      return [
        (q2 / n).toFixed(1),
        (q3 / n).toFixed(1),
        (q4 / n).toFixed(1),
        (q5 / n).toFixed(1)
      ];
    }

    function getDistribution() {
      if (allResponses.length === 0) return [0, 0, 0];
      let ruim = 0, regular = 0, otimo = 0;
      allResponses.forEach(r => {
        const media = (r.q2 + r.q3 + r.q4 + r.q5) / 4;
        if (media <= 4) ruim++;
        else if (media <= 7) regular++;
        else otimo++;
      });
      return [ruim, regular, otimo];
    }

    function renderCharts() {
      destroyAllCharts();

      const avg = calculateAverages();

      // 1. Média por Critério
      charts.criteria = new Chart(document.getElementById('chartCriteria'), {
        type: 'bar',
        data: {
          labels: ['Qualidade', 'Profissionais', 'Infraestrutura', 'Indicação'],
          datasets: [{ label: 'Média', data: avg, backgroundColor: '#3b82f6' }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 10 }}}
      });

      // 2. Distribuição de Notas
      const dist = getDistribution();
      charts.distribution = new Chart(document.getElementById('chartDistribution'), {
        type: 'doughnut',
        data: {
          labels: ['Ruim (≤4)', 'Regular (5-7)', 'Ótimo (8-10)'],
          datasets: [{ data: dist, backgroundColor: ['#ef4444', '#f59e0b', '#22c55e'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // 3. Evolução da Satisfação (por data)
      const sorted = [...allResponses].sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
      const dates = [...new Set(sorted.map(r => r.timestamp.split(' ')[0]))].slice(-7); // últimos 7 dias
      const avgByDate = dates.map(date => {
        const dayResponses = sorted.filter(r => r.timestamp.startsWith(date));
        const total = dayResponses.reduce((sum, r) => sum + (r.q2 + r.q3 + r.q4 + r.q5)/4, 0);
        return dayResponses.length ? (total / dayResponses.length).toFixed(1) : 0;
      });

      charts.trend = new Chart(document.getElementById('chartTrend'), {
        type: 'line',
        data: {
          labels: dates,
          datasets: [{ label: 'Média Geral', data: avgByDate, borderColor: '#3b82f6', tension: 0.4, fill: false }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // 4. NPS por Mês
      const monthMap = {};
      allResponses.forEach(r => {
        const date = new Date(r.timestamp);
        const key = `${date.getMonth()+1}/${date.getFullYear()}`;
        if (!monthMap[key]) monthMap[key] = { promoters: 0, detractors: 0, total: 0 };
        monthMap[key].total++;
        if (r.q5 >= 9) monthMap[key].promoters++;
        else if (r.q5 <= 6) monthMap[key].detractors++;
      });

      const months = Object.keys(monthMap).sort();
      const npsData = months.map(m => {
        const d = monthMap[m];
        return Math.round(((d.promoters - d.detractors) / d.total) * 100);
      });

      charts.npsMonth = new Chart(document.getElementById('chartNPSMonth'), {
        type: 'bar',
        data: {
          labels: months,
          datasets: [{ label: 'NPS', data: npsData, backgroundColor: '#8b5cf6', borderRadius: 6 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 }}}
      });
    }

    function updateKPIs() {
      const total = allResponses.length;
      document.getElementById('totalResponses').textContent = total;

      if (total === 0) {
        document.getElementById('avgScore').textContent = "0.0";
        document.getElementById('npsScore').textContent = "0";
        document.getElementById('excellentPct').textContent = "0%";
        return;
      }

      let sum = 0, promoters = 0, detractors = 0;
      allResponses.forEach(r => {
        const avg = (r.q2 + r.q3 + r.q4 + r.q5) / 4;
        sum += avg;
        if (r.q5 >= 9) promoters++;
        else if (r.q5 <= 6) detractors++;
      });

      const avgGeral = (sum / total).toFixed(1);
      const nps = Math.round(((promoters - detractors) / total) * 100);

      document.getElementById('avgScore').textContent = avgGeral;
      document.getElementById('npsScore').textContent = nps;
      document.getElementById('excellentPct').textContent = Math.round((promoters / total) * 100) + "%";
    }

    function exportToExcel() {
      if (allResponses.length === 0) return alert("Nenhuma resposta para exportar.");
      const ws = XLSX.utils.json_to_sheet(allResponses);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Respostas");
      XLSX.writeFile(wb, "pesquisa_sesi_saude.xlsx");
    }

    function openAdmin() {
      document.getElementById('surveyScreen').classList.add('hidden');
      document.getElementById('adminScreen').classList.remove('hidden');
      updateKPIs();
      renderCharts();
    }

    function closeAdmin() {
      document.getElementById('adminScreen').classList.add('hidden');
      document.getElementById('surveyScreen').classList.remove('hidden');
      destroyAllCharts();
    }

    document.getElementById('surveyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const response = {
        timestamp: new Date().toLocaleString('pt-BR'),
        q1: document.getElementById('q1').value,
        q2: parseInt(document.querySelector('input[name="q2"]:checked')?.value || 0),
        q3: parseInt(document.querySelector('input[name="q3"]:checked')?.value || 0),
        q4: parseInt(document.querySelector('input[name="q4"]:checked')?.value || 0),
        q5: parseInt(document.querySelector('input[name="q5"]:checked')?.value || 0),
        q6: document.getElementById('q6').value.trim()
      };

      allResponses.unshift(response);
      updateKPIs();

      alert("✅ Resposta registrada com sucesso!");
      document.getElementById('surveyForm').reset();
    });

    window.onload = () => {
      createRatingQuestion(2, 'Como você achou do atendimento geral do SESI Saúde?');
      createRatingQuestion(3, 'O que você achou dos profissionais?');
      createRatingQuestion(4, 'Como está a estrutura da unidade?');
      createRatingQuestion(5, 'Você indicaria o SESI Saúde para um amigo ou familiar?');
    };
  </script>
</body>
</html>
